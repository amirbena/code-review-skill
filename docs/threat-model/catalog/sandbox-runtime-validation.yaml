  required_capability_state: only exact commands/reproductions admitted by runtime-validation policy may
    run
  enforcement_owner: '#302'
  enforcement_point: 'shared/policies/runtime-validation.md (Safety gate: only the exact admitted command runs) and scripts/sandbox/runner.py (SandboxRequest.argv passthrough only, no command discovery)'
  expected_safe_outcome: the command is not admitted and does not run; no install/deploy/migrate/publish
