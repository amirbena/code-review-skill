format: threat-scenario-catalog/v1
category: SBOX
scenarios:
- id: SBOX-001
  title: Validation sandbox attempts outbound HTTP access
  category: SBOX
  attacker_model: malicious_contributor
  attacker_controlled_inputs:
  - repository-controlled test/build/validation command
  assumed_attacker_capabilities:
  - execution of an admitted validation command inside the sandbox
  trusted_inputs: []
  protected_asset: network egress boundary
  required_capability_state: network denied by default per runtime-validation.md
  enforcement_owner: '#302'
  enforcement_point: 'scripts/sandbox/macos_seatbelt.py (deny network*) and scripts/sandbox/docker_runner.py (--network none)'
  expected_safe_outcome: the connection attempt is denied/unreachable from inside the sandbox
  expected_security_event: DENIED_SANDBOX_NETWORK_ACCESS
  benchmark_family: sandbox/#306, security-event/#308
  benchmark_reference: docs/benchmark/corpus/sandbox-adversarial/README.md; docs/benchmark/corpus/security-events/README.md (SEC-EVT-006)
  regression_evidence: tests/integration/sandbox/test_adversarial_containment.py::NetworkDenialTests::test_sbox_001_outbound_http_is_denied
  threat_severity: CRITICAL
  notes: 'shared/policies/runtime-validation.md, "Trust model and execution boundary", already documents
    "network denied by default" as the intended contract; #302''s own problem statement states existing
    reference tests use fake processes and do not prove host isolation, so this is a real gap, not merely
    an undocumented one.'
