- id: SBOX-011
  title: A process or generated artifact persists past sandbox teardown
  category: SBOX
  attacker_model: runtime_misconfiguration
  attacker_controlled_inputs:
  - background process or file the validation command started
  assumed_attacker_capabilities:
  - execution of an admitted validation command inside the sandbox
  trusted_inputs: []
  protected_asset: teardown completeness
  required_capability_state: teardown kills descendants and removes ephemeral state
  enforcement_owner: '#302'
  enforcement_point: 'scripts/sandbox/process_exec.py (_kill_process_group, _expand_descendants best-effort sweep) and scripts/sandbox/docker_runner.py (_force_remove container teardown)'
  expected_safe_outcome: no child/background process or writable state survives teardown; a subsequent
    run starts clean
  expected_security_event: DENIED_SANDBOX_RESOURCE_EXHAUSTION
  benchmark_family: sandbox/#306
  benchmark_reference: docs/benchmark/corpus/sandbox-adversarial/README.md
  regression_evidence: tests/integration/sandbox/test_adversarial_containment.py::PersistenceTests (test_sbox_011_background_process_does_not_survive_teardown, test_sbox_011_generated_artifacts_and_caches_do_not_persist_on_the_host)
  threat_severity: MEDIUM
  notes: 'The Docker primitive closes this completely (its own PID namespace; docker_runner.py
    force-removes the container regardless of client-side state). The native macOS Seatbelt primitive
    has no PID namespace: scripts/sandbox/process_exec.py mitigates a self-detaching descendant with
    a best-effort early-window sweep (_expand_descendants), which is not a mathematical guarantee
    against a payload that calls setsid() before the very first poll. Docker is preferred whenever
    available (scripts/sandbox/capability.py detection order) so this residual gap is disclosed, not
    silently accepted as the general contract.'
- id: SBOX-012
