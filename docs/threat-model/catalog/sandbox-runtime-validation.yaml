- id: SBOX-013
  title: A required sandbox isolation primitive is unavailable on the host platform
  category: SBOX
  attacker_model: runtime_misconfiguration
  attacker_controlled_inputs:
  - host/platform capability surface at the time validation is requested
  assumed_attacker_capabilities:
  - no attacker control; a platform/runtime limitation
  trusted_inputs: []
  protected_asset: fail-closed behavior when isolation cannot be guaranteed
  required_capability_state: isolation primitive missing/unavailable
  enforcement_owner: '#302'
  enforcement_point: COVERAGE_GAP
  expected_safe_outcome: validation is reported as `unavailable`; the runtime never falls back to unrestricted
    host execution
  expected_security_event: NOT_APPLICABLE
  benchmark_family: sandbox/#306
  benchmark_reference: COVERAGE_GAP
  regression_evidence: COVERAGE_GAP
  threat_severity: HIGH
  notes: 'Not itself a denial of an attacker action, so no denied-capability event is expected — the safe
    outcome is refusal to run at all, which #299 may still choose to log as an operational event distinct
    from a denied-capability event.'
