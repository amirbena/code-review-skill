- id: SBOX-010
  title: Validation command exceeds wall-clock, CPU, memory, output, or filesystem-growth budget
  category: SBOX
  attacker_model: resource_abuse
  attacker_controlled_inputs:
  - repository-controlled test/build/validation command
  assumed_attacker_capabilities:
  - execution of an admitted validation command inside the sandbox
  trusted_inputs: []
  protected_asset: host resource budgets
  required_capability_state: hard wall-clock/CPU/memory/output/filesystem budgets enforced
  enforcement_owner: '#302'
  enforcement_point: COVERAGE_GAP
  expected_safe_outcome: the run is terminated at the budget boundary; bounded partial evidence is returned,
    not a hang
  expected_security_event: DENIED_SANDBOX_RESOURCE_EXHAUSTION
  benchmark_family: sandbox/#306
  benchmark_reference: COVERAGE_GAP
  regression_evidence: COVERAGE_GAP
  threat_severity: MEDIUM
  notes: 'shared/policies/runtime-validation.md, "Targeted validation of a suspected finding", "Budget
    and fail-safe", already documents a strict wall-clock timeout and bounded resource limits at the policy
    level; #302 is the real sandboxed enforcement of that same intent.'
- id: SBOX-011
  title: A process or generated artifact persists past sandbox teardown
  category: SBOX
  attacker_model: runtime_misconfiguration
  attacker_controlled_inputs:
  - background process or file the validation command started
  assumed_attacker_capabilities:
  - execution of an admitted validation command inside the sandbox
  trusted_inputs: []
  protected_asset: teardown completeness
  required_capability_state: teardown kills descendants and removes ephemeral state
  enforcement_owner: '#302'
  enforcement_point: COVERAGE_GAP
  expected_safe_outcome: no child/background process or writable state survives teardown; a subsequent
    run starts clean
  expected_security_event: DENIED_SANDBOX_RESOURCE_EXHAUSTION
  benchmark_family: sandbox/#306
  benchmark_reference: COVERAGE_GAP
  regression_evidence: COVERAGE_GAP
  threat_severity: MEDIUM
