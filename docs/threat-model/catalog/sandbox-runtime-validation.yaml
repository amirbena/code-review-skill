- id: SBOX-010
  title: Validation command exceeds wall-clock, CPU, memory, output, or filesystem-growth budget
  category: SBOX
  attacker_model: resource_abuse
  attacker_controlled_inputs:
  - repository-controlled test/build/validation command
  assumed_attacker_capabilities:
  - execution of an admitted validation command inside the sandbox
  trusted_inputs: []
  protected_asset: host resource budgets
  required_capability_state: hard wall-clock/CPU/memory/output/filesystem budgets enforced
  enforcement_owner: '#302'
  enforcement_point: 'scripts/sandbox/process_exec.py (run_bounded wall-clock/output/filesystem-growth budgets; _preexec RLIMIT_CPU/RLIMIT_AS)'
