  notes: Contract defined by #662 in shared/policies/workspace-sibling-context.md; enforced by #663 in both adapters (reference model tests/reference/review/workspace_sibling_context.py).
- id: INJECT-019
  title: Sibling content leaks through a published GitHub review surface
  category: INJECT
  attacker_model: confused_deputy
  attacker_controlled_inputs:
  - sibling file content that a published review comment, summary, or inline comment could quote or paraphrase
  assumed_attacker_capabilities:
  - ability to place content in a sibling repository that the reviewer is allowed to read, and to read the published review without access to that sibling
  trusted_inputs:
  - the caller-granted workspace root supplied in the current invocation
  protected_asset: confidentiality of sibling repository content outside the reviewer's local report
  required_capability_state: a sibling was read and a GitHub review surface is being published
  enforcement_owner: '#663'
  enforcement_point: 'shared/policies/workspace-sibling-context.md, "Secret and privacy boundaries" (publication surfaces carry references only)'
  expected_safe_outcome: the published surface carries only repository identity, short SHA, and path; no sibling file content or excerpt, quoted or paraphrased, appears on any published surface
  expected_security_event: NOT_APPLICABLE
  benchmark_family: none
  benchmark_reference: workspace sibling benchmark corpus is tracked by #664; deterministic regression lives in the security test
  regression_evidence: tests/unit/security/test_workspace_sibling_context_security.py
  threat_severity: HIGH
  notes: Contract defined by #662; enforced by #663 in both adapters (reference model tests/reference/review/workspace_sibling_context.py).
- id: INJECT-020
  title: Parallel worker or parallel-review copy inherits or exercises the primary reviewer's workspace grant
  category: INJECT
  attacker_model: confused_deputy
  attacker_controlled_inputs:
  - child-spawn request parameters
  - the primary reviewer's workspace root, listing, or sibling evidence
  assumed_attacker_capabilities:
  - spawn capability; ability to pass state to a worker
  trusted_inputs:
  - the caller-granted workspace root supplied in the current invocation to the primary reviewer only
  protected_asset: non-transferability of the workspace grant
  required_capability_state: the grant is scoped to the primary reviewer of the invocation, never propagated to a worker
  enforcement_owner: '#663'
  enforcement_point: 'shared/policies/workspace-sibling-context.md, "Primary-reviewer-only authority"'
  expected_safe_outcome: a worker receives no root, listing, or sibling evidence and cannot read any sibling; it reports the unresolved question to the primary reviewer
  expected_security_event: NOT_APPLICABLE
  benchmark_family: none
  benchmark_reference: workspace sibling benchmark corpus is tracked by #664; deterministic regression lives in the security test
  regression_evidence: tests/unit/security/test_workspace_sibling_context_security.py
  threat_severity: HIGH
  notes: Contract defined by #662 in shared/policies/workspace-sibling-context.md; enforced by #663 in both adapters (reference model tests/reference/review/workspace_sibling_context.py).
