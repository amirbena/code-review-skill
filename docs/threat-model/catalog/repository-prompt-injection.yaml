- id: INJECT-019
  title: Sibling content leaks through a published GitHub review surface
  category: INJECT
  attacker_model: confused_deputy
  attacker_controlled_inputs:
  - sibling file content that a published review comment, summary, or inline comment could quote or paraphrase
