# Risk-depth corpus case (Issue #90). Format: ../../fixture-format.md.
# See ./README.md for the cluster.
#
# Python, `diff_size` signal only -- no catalog signal fires anywhere in
# this change (no auth/migration/concurrency/public_api/sensitive_path/
# infra_config label applies to any touched file). `format_currency`'s
# parameter order is swapped at its definition and at ten call sites; the
# change touches 11 files, crossing change-risk-signals.md's
# `changed_files >= 10` elevated diff-size boundary on file count alone,
# even though no single hunk is risky-looking. One call site is updated
# incorrectly -- it still passes the old (amount, currency) order into the
# new (currency, amount) signature -- so the size-driven elevated depth is
# what catches a real bug a lighter pass could plausibly skip past.

