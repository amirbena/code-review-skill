expected:
  decision: changes-required
  findings_completeness: exhaustive
  findings:
    - key: payout-total-format-currency-arg-order-not-updated
      match: required
      severity: P1
      location:
        location_intent: line
        path: app/billing/payout.py
        symbol: render_payout_total
        anchor: "return format_currency(amount, currency)"
      claim: >-
        format_currency's parameters were reordered to (currency, amount)
        everywhere else in this change, but render_payout_total's call
        site was left unchanged, so it now passes amount where currency is
        expected and vice versa, producing a garbled total on payout
        receipts.
      defect_kind: argument-order-mismatch

metadata:
  source: crafted
  tags: [correctness]
  rationale: >-
    Demonstrates the `diff_size` signal alone selecting `elevated` depth
    via the changed-files boundary (11 files >= 10), with no catalog
    signal (auth/migration/concurrency/public_api/sensitive_path/
    infra_config) firing on any touched file. The one call site left in
    the old argument order is a real regression a shallow pass over 10
    near-identical hunks could plausibly rubber-stamp.
