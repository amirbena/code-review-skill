# Null-like absence-risk corpus case (Issue #121). Format: ../../fixture-format.md.
# See ./README.md for the cluster.
#
# Java. The direct guarded counterpart of
# null-absence-java-unguarded-dereference.yaml: the same nullable
# findById() result is checked with an explicit early return before the
# only dereference on this path. This is the "properly guarded equivalent
# is not reported" case required by Issue #121's acceptance criteria —
# demonstrating the suppression rule, not a second unrelated scenario.

format: benchmark-case/v1

id: null-absence-java-guarded-clean
title: "UserNotifier.notify() guards the nullable findUser result with an early return"

input:
  patch: |
    diff --git a/src/main/java/app/user/UserNotifier.java b/src/main/java/app/user/UserNotifier.java
    index 1111111..3333333 100644
    --- a/src/main/java/app/user/UserNotifier.java
    +++ b/src/main/java/app/user/UserNotifier.java
    @@ -7,6 +7,10 @@ public class UserNotifier {
         }

         public String notify(long userId) {
    -        return "notified";
    +        User user = repository.findById(userId);
    +        if (user == null) {
    +            return "no such user";
    +        }
    +        return "notified " + user.getEmail();
         }
     }
  base:
    src/main/java/app/user/UserNotifier.java: |
      package app.user;

      public class UserNotifier {
          private final UserRepository repository;

          public UserNotifier(UserRepository repository) {
              this.repository = repository;
          }

          public String notify(long userId) {
              return "notified";
          }
      }
    src/main/java/app/user/UserRepository.java: |
      package app.user;

      public interface UserRepository {
          // Returns null when no user with this id exists.
          User findById(long userId);
      }
    src/main/java/app/user/User.java: |
      package app.user;

      public class User {
          private final String email;

          public User(String email) {
              this.email = email;
          }

          public String getEmail() {
              return email;
          }
      }

expected:
  decision: clean
  findings_completeness: exhaustive
  findings: []

metadata:
  source: crafted
  tags: [correctness, no-op]
  rationale: >-
    Demonstrates the suppression rule alongside
    null-absence-java-unguarded-dereference.yaml: the identical nullable
    findById() result is checked with `if (user == null)` before the only
    dereference, so the path to user.getEmail() can no longer be reached
    with an absent value. A correct review reports no finding — the
    reachable-failure-path question, not the value's declared type, is
    what decides the outcome.
