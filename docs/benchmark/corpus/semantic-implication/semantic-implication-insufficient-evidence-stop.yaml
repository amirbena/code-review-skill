# Semantic-implication corpus case (Issue #211). Format: ../../fixture-format.md.
# See ./README.md for the cluster.
#
# Python. The concurrency / distributed-system dimension's *syntactic*
# shape is present (a module-level dict read, checked, and written back),
# which is exactly the "shared-state read-decide-write" worked example in
# review-scope.md. But nothing in the diff or the available module shows
# more than one caller, a thread pool, an async framework, or any other
# evidence that get_report/clear_stale are ever invoked concurrently. Per
# "Bounded expansion and stop conditions," reused from "Architectural
# placement and execution-lifecycle fidelity," insufficient evidence is a
# valid terminal outcome: the correct review recognizes the signal, looks
# for corroborating evidence, finds none available, and stops without
# manufacturing a race-condition finding it cannot support.

format: benchmark-case/v1

id: semantic-implication-insufficient-evidence-stop
title: "Report cache gains a stale-entry sweep; no evidence of concurrent access exists to support a race finding"

input:
  patch: |
    diff --git a/scripts/report_cache.py b/scripts/report_cache.py
    index 1111111..2222222 100644
    --- a/scripts/report_cache.py
    +++ b/scripts/report_cache.py
    @@ -1,9 +1,21 @@
    +import time
    +
     _cache = {}
    +_cache_times = {}


     def get_report(report_id, loader):
         if report_id in _cache:
             return _cache[report_id]
         value = loader(report_id)
         _cache[report_id] = value
    +    _cache_times[report_id] = time.time()
         return value
    +
    +
    +def clear_stale(max_age_seconds):
    +    now = time.time()
    +    stale = [k for k, t in _cache_times.items() if now - t > max_age_seconds]
    +    for k in stale:
    +        del _cache[k]
    +        del _cache_times[k]
  base:
    scripts/report_cache.py: |
      _cache = {}


      def get_report(report_id, loader):
          if report_id in _cache:
              return _cache[report_id]
          value = loader(report_id)
          _cache[report_id] = value
          return value

expected:
  decision: clean
  findings_completeness: exhaustive
  findings: []

metadata:
  source: crafted
  tags: [correctness, quality]
  rationale: >-
    Demonstrates a dimension whose syntactic signal fires (shared
    module-level dict, read-then-write) but for which the available
    evidence cannot establish that concurrent access is actually possible
    — no caller, thread pool, async entry point, or scheduler is present
    anywhere in the diff or base. The correct outcome is the documented
    "insufficient evidence is a valid terminal outcome," not a speculative
    race-condition finding.
