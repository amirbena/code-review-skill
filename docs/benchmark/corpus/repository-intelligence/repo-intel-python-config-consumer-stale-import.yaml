# Repository-intelligence corpus case (Issue #129). Format:
# docs/benchmark/fixture-format.md. See ./README.md for the cluster.
#
# Python, config-consumer trigger. app/settings.py renames MAX_UPLOAD_MB (a
# megabyte limit) to MAX_UPLOAD_BYTES (a byte limit) -- the old name is
# removed entirely. Read alone, settings.py's diff looks like an ordinary
# rename; nothing in it is wrong on its own.
#
# A diff-only review never sees app/uploads.py, which is not part of the
# diff at all. A relationship-aware review follows the config-consumer
# trigger (a changed configuration key) into ring 1 and resolves
# app/uploads.py, supplied here via `input.base`, which still imports the
# removed name.

format: benchmark-case/v1

id: repo-intel-python-config-consumer-stale-import
title: "Config-consumer trigger catches a stale import after a config key is renamed and removed"

input:
  patch: |
    diff --git a/app/settings.py b/app/settings.py
    index 1111111..2222222 100644
    --- a/app/settings.py
    +++ b/app/settings.py
    @@ -1,3 +1,3 @@
     DEBUG = False
    -MAX_UPLOAD_MB = 25
    +MAX_UPLOAD_BYTES = 25 * 1024 * 1024
  base:
    app/settings.py: |
      DEBUG = False
      MAX_UPLOAD_MB = 25
    app/uploads.py: |
      from app.settings import MAX_UPLOAD_MB


      def validate_upload(file_bytes):
          if len(file_bytes) > MAX_UPLOAD_MB:
              raise UploadTooLarge()

expected:
  decision: changes-required
  findings_completeness: exhaustive
  findings:
    - key: uploads-imports-removed-config-key
      match: required
      severity: P0
      location:
        location_intent: cross-file
        path: app/uploads.py
        symbol: validate_upload
        anchor: "from app.settings import MAX_UPLOAD_MB"
      claim: >-
        app/settings.py removes MAX_UPLOAD_MB, renaming it to
        MAX_UPLOAD_BYTES with a unit change; app/uploads.py still imports
        MAX_UPLOAD_MB, so the module fails to import (ImportError) as soon
        as an upload path is exercised.
      defect_kind: stale-config-reference

metadata:
  source: crafted
  tags: [correctness]
  rationale: >-
    settings.py's own diff reads as an ordinary rename; only resolving the
    config-consumer trigger into the untouched consumer file reveals the
    break. Demonstrates the config-consumer trigger's relationship-aware
    gain when the consumer file never appears in the diff at all.
