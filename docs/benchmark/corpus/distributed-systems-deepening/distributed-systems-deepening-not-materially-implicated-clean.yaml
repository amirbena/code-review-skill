# Distributed-systems-deepening corpus case (Issue #272, parent #84,
# grandparent #82). Format: ../../fixture-format.md. See ./README.md for
# the cluster.
#
# get_setting_or_default only reads the module-level _settings dict that
# load_settings populates once at startup; it introduces no new write, no
# retryable operation, and no evidence of concurrent mutation. Per
# distributed-systems-deepening.md's Activation condition 1, the
# Concurrency / distributed-system semantics domain is not materially
# implicated by review-scope.md's base pass in the first place, so the
# deepening capability never engages.

format: benchmark-case/v1

id: distributed-systems-deepening-not-materially-implicated-clean
title: "get_setting_or_default adds a read-only accessor over settings already loaded once at startup"

input:
  patch: |
    diff --git a/app/settings.py b/app/settings.py
    index 1111111..2222222 100644
    --- a/app/settings.py
    +++ b/app/settings.py
    @@ -10,6 +10,10 @@
         return _settings[key]


    +def get_setting_or_default(key, default):
    +    return _settings.get(key, default)
    +
    +
     def _read_config(path):
         with open(path) as f:
             return dict(line.strip().split("=", 1) for line in f if "=" in line)
  base:
    app/settings.py: |
      _settings = None


      def load_settings(config_path):
          global _settings
          _settings = _read_config(config_path)


      def get_setting(key):
          return _settings[key]


      def _read_config(path):
          with open(path) as f:
              return dict(line.strip().split("=", 1) for line in f if "=" in line)

expected:
  decision: clean
  findings_completeness: exhaustive
  findings: []

metadata:
  source: crafted
  tags: [concurrency]
  rationale: >-
    A read-only accessor over state populated once at startup is not by
    itself a concurrency concern: get_setting_or_default introduces no
    write, no message/event that can be delivered more than once or out
    of order, and no evidence that more than one caller mutates
    _settings. Base reasoning does not materially implicate the
    Concurrency / distributed-system semantics dimension, so
    distributed-systems-deepening.md's Activation condition 1 is never
    satisfied and the capability does not engage — distinct from the
    filename-signal case, which pins that a message-queue-adjacent name
    alone must not trigger engagement even when the file looks
    concurrency-relevant.
