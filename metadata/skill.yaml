# Portable metadata for the Code Review Agent Skill.
# Describes the package; it is not itself executable behavior.
# See SKILL.md for the operational entry point.

name: github-code-review
description: >-
  Senior-reviewer-style Code Review Agent Skill for GitHub repositories.
  Reviews local implementation branches and GitHub Pull Requests, returns
  P0/P1/P2 findings, and optionally publishes inline comments plus an
  Approve/Request Changes decision.
version: 0.1.0
entrypoint: SKILL.md

modes:
  - passive-local
  - passive-pr
  - active-pr

capabilities:
  git: required
  github_cli: required-for-github-operations

config:
  file: review-config.yaml

policies_dir: policies
runbooks_dir: runbooks
templates_dir: templates
