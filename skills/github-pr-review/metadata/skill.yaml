# Portable metadata for the github-pr-review Skill.
# Describes the package; it is not itself executable behavior.
# See SKILL.md for the operational entry point.
#
# Canonical Agent Skills discovery metadata (name/description) lives in
# ../SKILL.md's YAML frontmatter. The name/description below are a
# package-metadata mirror for non-Agent-Skills consumers of this file;
# keep them identical to ../SKILL.md if either changes.

name: github-pr-review
description: >-
  Reviews an existing GitHub Pull Request authored by someone other than
  the local user or calling Agent — passively as a report, or, with
  authenticated GitHub access, actively by publishing inline PR review
  comments, one consolidated final summary, and an Approve/Request
  Changes decision. Never edits implementation code and never merges.
  Not applicable, and must not be selected, for a PR or code the local
  user or calling Agent authored — use `local-code-review` for
  local/uncommitted changes with no PR.
version: 0.1.0
entrypoint: SKILL.md

modes:
  - passive-pr
  - active-pr

capabilities:
  git: required
  github_access: required-for-github-state
  github_review_permissions: required-for-active-publication

output:
  mutates_github: conditional # true only in active mode, and only after access verification
  mutates_repository: false
  can_approve: true
  can_request_changes: true
  can_merge: false

shared:
  policies:
    - ../../../shared/policies/review-scope.md
    - ../../../shared/policies/severity.md
    - ../../../shared/policies/evidence.md
    - ../../../shared/policies/repository-instructions.md
    - ../../../shared/policies/git-safety.md
    - ../../../shared/policies/review-ownership.md
    - ../../../shared/policies/file-reviewability.md
  templates:
    - ../../../shared/templates/finding.md
    - ../../../shared/templates/review-summary.md
