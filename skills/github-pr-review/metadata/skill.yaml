# Portable metadata for the github-pr-review Skill.
# Describes the package; it is not itself executable behavior.
# See SKILL.md for the operational entry point.
#
# Canonical Agent Skills discovery metadata (name/description) lives in
# ../SKILL.md's YAML frontmatter. The name/description below are a
# package-metadata mirror for non-Agent-Skills consumers of this file;
# keep them identical to ../SKILL.md if either changes.

name: github-pr-review
description: >-
  Reviews an existing GitHub Pull Request — passively as a report, or,
  with authenticated GitHub access, actively by publishing inline PR
  review comments and one consolidated final summary. Review analysis is
  separate from GitHub mutation authority: the default is a non-mutating
  recommendation, and an Approve/Request Changes decision is submitted
  only under independently trusted authorization with genuine reviewer
  independence. Self-review is allowed — the Skill analyzes its own PR
  and produces a verdict — but self-approval is not: no formal
  Approve/Request Changes is ever submitted on the reviewer's own work.
  Never edits implementation code and never merges. For local,
  not-yet-PR'd changes use `local-code-review`.
version: 0.1.0
entrypoint: SKILL.md

modes:
  - passive-pr
  - active-pr

capabilities:
  git: required
  github_access: required-for-github-state
  github_review_permissions: required-for-active-publication
  external_review_context: optional # caller-supplied requirements / pasted Jira / GitHub Issue / HLD / ADR / plan / PR description; see ../../../shared/policies/review-context.md and ../policies/review-context.md
  jira_context_resolution: optional # only when a Jira reference is supplied; resolved via an available Jira MCP/connector, read-only; unresolved -> JIRA CONTEXT UNRESOLVED (no inference fallback); see ../../../shared/policies/review-context.md "Jira context resolution"
  prior_review_evidence: considered-when-available # the PR's own prior reviews/comments; see ../../../shared/policies/review-evidence.md and ../policies/review-evidence.md
  repository_access_mode: api-only|optional-repository-backed|required-repository-backed # required checkout failure is REVIEW INCOMPLETE; see ../policies/repository-checkout.md
  parallel_review: optional # split review across workers per dimension when the runtime exposes a reliable capability; execution optimisation only; see ../../../shared/policies/parallel-review.md and ../policies/parallel-review.md
  review_action_authorization: independent-trusted-source-required-for-auto-action # review analysis is separate from GitHub mutation authority; agent-controlled flags/prompts/tokens/identities cannot establish it; ambiguity fails closed; see ../policies/review-action-authorization.md

output:
  mutates_github: conditional # true only in active mode, after access verification, and only in explicitly-authorized auto-action mode (recommendation-only is the default and never mutates)
  mutates_repository: false # repository-backed checkout is an isolated temp clone, never the target repo, and read-only
  default_review_action_mode: recommendation-only # full review + reasoning result, no GitHub mutation; block-only and explicitly-authorized-auto-action require reviewer independence (and, for approval, trusted authorization); see ../policies/review-action-authorization.md
  can_approve: conditional # only in explicitly-authorized auto-action mode with trusted, PR/HEAD-scoped authorization and genuine reviewer independence; a clean verdict alone never approves
  can_request_changes: conditional # block-only or auto-action mode, with reviewer independence and GitHub event permission
  can_merge: false # never; merge authority is not inferred from a clean verdict, approval authorization, or a submitted approval
  executes_target_repository_code: false # never runs the target repo's tests/builds/linters/hooks/scripts

shared:
  policies:
    - ../../../shared/policies/review-scope.md
    - ../../../shared/policies/severity.md
    - ../../../shared/policies/evidence.md
    - ../../../shared/policies/repository-instructions.md
    - ../../../shared/policies/git-safety.md
    - ../../../shared/policies/review-ownership.md
    - ../../../shared/policies/file-reviewability.md
    - ../../../shared/policies/review-context.md
    - ../../../shared/policies/review-evidence.md
    - ../../../shared/policies/parallel-review.md
    - ../../../shared/policies/invocation-options.md
    - ../../../shared/policies/remediation-guidance.md
  templates:
    - ../../../shared/templates/finding.md
    - ../../../shared/templates/review-summary.md
