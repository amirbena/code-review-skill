# Portable metadata for the github-pr-review Skill.
# Describes the package; it is not itself executable behavior.
# See SKILL.md for the operational entry point.
#
# Canonical Agent Skills discovery metadata (name/description) lives in
# ../SKILL.md's YAML frontmatter. The name/description below are a
# package-metadata mirror for non-Agent-Skills consumers of this file;
# keep them identical to ../SKILL.md if either changes.

name: github-pr-review
description: >-
  Reviews an existing GitHub Pull Request under one of three publication
  modes: passively as a report (PASSIVE), as a non-mutating preview of the
  active decision (SEMI), or, with authenticated GitHub access, actively
  by publishing inline PR review comments, one consolidated final
  summary, and an Approve/Request Changes decision (ACTIVE). An explicit
  ACTIVE request is itself sufficient authorization to publish that
  review's own outcome — no second activation phrase is required —
  subject to genuine reviewer independence and GitHub permission.
  Self-review is allowed — the Skill analyzes its own PR and produces a
  verdict — but self-approval is not: no formal Approve/Request Changes
  is ever submitted on the reviewer's own work. Never edits implementation
  code and never merges. For local, not-yet-PR'd changes use
  `local-code-review`.
version: 0.1.0
entrypoint: SKILL.md

modes:
  - passive-pr
  - semi-pr
  - active-pr

capabilities:
  git: required
  github_access: required-for-github-state
  github_review_permissions: required-for-active-publication
  human_review_output: optional # presentation-only; natural-language opt-in ("make the review shorter and more human" / "like a senior engineer" / "senior review" / "senior code review" / "senior pr review" / "review this as a senior"), no CLI flag; renders the final human-facing summary, and (github-pr-review only) any body/fallback finding rendered in full rather than inline — passive review's findings, and an active fallback finding with no valid inline anchor — in a concise senior-engineer voice; never changes findings/severity/dedup/verdict/review-state/machine-readable-status, placement, or publication ordering; see ../../../shared/policies/invocation-options.md and ../../../shared/templates/finding-rendering.md "Canonical human full rendering"
  human_inline_findings: optional # presentation-only; derived default `explicit_value ?? human_review_output` (invocation-options.md "`human_inline_findings` derived default and phrasings"); extends the senior-engineer voice to inline review comments only (severity-keeping heading + prose in place of Evidence/Impact/Fix); no CLI flag; never changes findings/severity/identity/dedup/verdict/review-state/machine-readable-status, the canonical fix/action anchor, the #164/#165 body fallback, or publication ordering — only inline wording; a body/fallback finding's wording is governed by `human_review_output` directly, not this option; see ../policies/finding-placement.md and ../templates/inline-finding.md
  external_review_context: optional # caller-supplied requirements / pasted Jira / GitHub Issue / HLD / ADR / plan / PR description; see ../../../shared/policies/review-context.md and ../policies/review-context.md
  requirement_coverage: conditional # activates only for authoritative requirements / acceptance criteria; emits evidence-backed per-requirement status plus task-relative completeness; see ../../../shared/policies/requirement-coverage.md
  jira_context_resolution: optional # only when a Jira reference is supplied; resolved via an available Jira MCP/connector, read-only; unresolved -> JIRA CONTEXT UNRESOLVED (no inference fallback); see ../../../shared/policies/review-context.md "Jira context resolution"
  prior_review_evidence: considered-when-available # the PR's own prior reviews/comments; see ../../../shared/policies/review-evidence.md and ../policies/review-evidence.md
  repository_access_mode: api-only|optional-repository-backed|required-repository-backed # required checkout failure is REVIEW INCOMPLETE; see ../policies/repository-checkout.md
  parallel_review: optional # split review across workers per dimension when the runtime exposes a reliable capability; execution optimisation only; see ../../../shared/policies/parallel-review.md and ../policies/parallel-review.md
  review_action_authorization: active-mode-request-is-its-own-authorization # single canonical publication mode (PASSIVE|SEMI|ACTIVE); an explicit ACTIVE request is itself sufficient authorization to publish, subject to self-review/reviewer-independence/GitHub-permission/HEAD; ambiguity fails closed; see ../policies/review-action-authorization.md
  machine_readable_review_status: optional # one stable aggregated exact-HEAD GitHub status/check for the reviewed SHA, separate from native APPROVE/REQUEST_CHANGES; a blocking status is blocking-only enforcement (allowed for a self-review); a success status needs the same ACTIVE publication mode + reviewer independence as APPROVE and is never published by a self-review; a new HEAD inherits no green; see ../policies/review-status-enforcement.md
  required_check_setup: explicit-opt-in-only # adding the status context to base-branch required checks is a separate explicitly-requested action, minimal and preserving (never touches approval-count / dismiss_stale_reviews_on_push / require_last_push_approval / bypass actors / unrelated rules); never performed during an ordinary review; see ../policies/review-status-enforcement.md

output:
  mutates_github: conditional # true only in ACTIVE publication mode, after access verification and reviewer-independence/GitHub-permission/HEAD checks (PASSIVE and SEMI never mutate)
  mutates_repository: false # repository-backed checkout is an isolated temp clone, never the target repo, and read-only
  default_publication_mode: passive # full review + reasoning result, no GitHub mutation; SEMI and ACTIVE require reviewer independence (an explicit ACTIVE request is its own authorization; see ../policies/review-action-authorization.md)
  can_approve: conditional # only in ACTIVE publication mode with genuine reviewer independence and GitHub event permission; a clean verdict alone never approves
  can_request_changes: conditional # ACTIVE publication mode, with reviewer independence and GitHub event permission
  self_review_publication: informational-comment-only # a self-review may publish its result as a GitHub review COMMENT; it never submits a formal APPROVE / REQUEST_CHANGES on own work
  publishes_machine_readable_status: conditional # ACTIVE publication mode only; blocking status can be published even by a self-review; a success status only in ACTIVE mode with reviewer independence, and never by a self-review; bound to the exact reviewed HEAD; see ../policies/review-status-enforcement.md
  mutates_repository_governance: false-except-explicit-required-check-setup # only the separate opt-in setup action adds the one status context to required checks; it preserves every unrelated rule, required check, bypass actor, and approval/stale-review setting; never merges
  can_merge: false # never; merge authority is not inferred from a clean verdict, approval authorization, a submitted approval, or a published status
  executes_target_repository_code: conditional # only an exact safe declared command, or the smallest disposable targeted reproduction of one suspected finding, inside the required execution boundary; per ../../../shared/policies/runtime-validation.md; never directly on the reviewer host
  final_summary_is_last_publication: true # final review comment == last publication event; any machine-readable status is published before it; nothing review-owned is published or edited after it; identical whether or not human_review_output is on; see ../policies/review-output.md "Submission ordering"

