# Portable metadata for the local-code-review Skill.
# Describes the package; it is not itself executable behavior.
# See SKILL.md for the operational entry point.
#
# Canonical Agent Skills discovery metadata (name/description) lives in
# ../SKILL.md's YAML frontmatter. The name/description below are a
# package-metadata mirror for non-Agent-Skills consumers of this file;
# keep them identical to ../SKILL.md if either changes.

name: local-code-review
description: >-
  Reviews local, not-yet-PR'd Git changes (committed delta, staged,
  unstaged, and untracked) and returns evidence-backed P0/P1/P2 findings.
  Read-only and opt-in only: never edits, commits, pushes, or touches
  GitHub, and every review or re-review requires explicit user selection.
  Optionally accepts free-form context such as requirements, Jira/HLD/ADR,
  acceptance criteria, or implementation plans to focus the review, plus
  an associated GitHub PR reference for reconciling prior findings and
  architectural decisions. The local delta always remains the review
  scope. For reviewing an existing PR itself, use github-pr-review.

version: 0.3.0
entrypoint: SKILL.md

modes:
  - passive-local

capabilities:
  git: required
  local_repository_access: required
  external_review_context: optional # free-form context; see ../policies/review-context.md
  github_read_access: optional # only used when a PR reference is supplied; see ../policies/pr-context.md

output:
  mutates_github: false
  mutates_repository: false
  manages_review_loop: false

shared:
  policies:
    - ../../../shared/policies/review-scope.md
    - ../../../shared/policies/severity.md
    - ../../../shared/policies/evidence.md
    - ../../../shared/policies/repository-instructions.md
    - ../../../shared/policies/git-safety.md
    - ../../../shared/policies/review-ownership.md
    - ../../../shared/policies/file-reviewability.md
  templates:
    - ../../../shared/templates/finding.md
    - ../../../shared/templates/review-summary.md
