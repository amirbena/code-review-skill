# Portable metadata for the local-code-review Skill.
# Describes the package; it is not itself executable behavior.
# See SKILL.md for the operational entry point.
#
# Canonical Agent Skills discovery metadata (name/description) lives in
# ../SKILL.md's YAML frontmatter. The name/description below are a
# package-metadata mirror for non-Agent-Skills consumers of this file;
# keep them identical to ../SKILL.md if either changes.

name: local-code-review
description: Review local Git changes and return evidence-backed P0/P1/P2 code-review findings.

version: 0.3.0
entrypoint: SKILL.md

modes:
  - passive-local

capabilities:
  git: required
  local_repository_access: required
  human_review_output: optional # presentation-only; natural-language opt-in ("make the review shorter and more human" / "like a senior engineer"), no CLI flag; renders only the human-facing body in a concise senior-engineer voice, trailing metadata unchanged; never changes findings/severity/dedup/reconciliation or the mechanical Decision; see ../../../shared/policies/invocation-options.md
  human_inline_findings: optional # presentation-only; derived default `explicit_value ?? human_review_output`; a github-pr-review inline-comment concept, normalized here only for direct/mediated parity — local-code-review publishes no inline review comments, so it has no effect on local output; see ../../../shared/policies/invocation-options.md
  external_review_context: optional # free-form requirements / pasted Jira / GitHub Issue / HLD / ADR / plan; see ../../../shared/policies/review-context.md and ../policies/review-context.md
  requirement_coverage: conditional # activates only for authoritative requirements / acceptance criteria; emits evidence-backed per-requirement status plus task-relative completeness; see ../../../shared/policies/requirement-coverage.md
  jira_context_resolution: optional # only when a Jira reference is supplied; resolved via an available Jira MCP/connector, read-only; unresolved -> JIRA CONTEXT UNRESOLVED (no inference fallback); see ../../../shared/policies/review-context.md "Jira context resolution"
  github_read_access: optional # PR reference -> prior review evidence (../../../shared/policies/review-evidence.md, ../policies/pr-context.md); GitHub Issue reference -> read-only Issue retrieval

output:
  executes_target_repository_code: conditional # only a safe declared command, or the smallest disposable targeted reproduction of one suspected finding, inside the disposable execution boundary required by ../../../shared/policies/runtime-validation.md; on the reviewer host only under the explicit, out-of-band, per-invocation trusted-host authorization in ../../../shared/policies/trusted-host-execution.md, default off, never inferred from repository content
  mutates_github: false
  mutates_repository: false
  manages_review_loop: false

shared:
  policies:
    - ../../../shared/policies/review-scope.md
    - ../../../shared/policies/change-risk-signals.md
    - ../../../shared/policies/repository-expansion.md
    - ../../../shared/policies/large-pr-partitioning.md
    - ../../../shared/policies/review-stopping-criteria.md
    - ../../../shared/policies/root-cause-consolidation.md
    - ../../../shared/policies/affected-test-analysis.md
    - ../../../shared/policies/null-absence-risk.md
    - ../../../shared/policies/failure-retry-recovery.md
    - ../../../shared/policies/architectural-placement.md
    - ../../../shared/policies/api-contract-compatibility.md
    - ../../../shared/policies/severity.md
    - ../../../shared/policies/verdict-consistency.md
    - ../../../shared/policies/evidence.md
    - ../../../shared/policies/repository-instructions.md
    - ../../../shared/policies/review-base-policy.md
    - ../../../shared/policies/runtime-validation.md
    - ../../../shared/policies/trusted-host-execution.md
    - ../../../shared/policies/git-safety.md
    - ../../../shared/policies/mutation-authority.md
    - ../../../shared/policies/review-ownership.md
    - ../../../shared/policies/file-reviewability.md
    - ../../../shared/policies/review-context.md
    - ../../../shared/policies/requirement-coverage.md
    - ../../../shared/policies/jira-context.md
    - ../../../shared/policies/review-evidence.md
    - ../../../shared/policies/parallel-review.md
    - ../../../shared/policies/agent-delegation.md
    - ../../../shared/policies/invocation-options.md
    - ../../../shared/policies/remediation-guidance.md
    - ../../../shared/policies/remediation-scope-boundary.md
    - ../../../shared/policies/specialist-depth.md
    - ../../../shared/policies/security-deepening.md
    - ../../../shared/policies/distributed-systems-deepening.md
    - ../../../shared/policies/database-migration-deepening.md
    - ../../../shared/policies/performance-deepening.md
  templates:
    - ../../../shared/templates/finding.md
    - ../../../shared/templates/finding-rendering.md
