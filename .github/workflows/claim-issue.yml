name: Claim contribution issue

on:
  issue_comment:
    types:
      - created

# The workflow reads issue state and only mutates labels/comments. It never
# checks out or executes contributor-controlled code.
permissions:
  contents: read
  issues: write

jobs:
  claim:
    if: ${{ !github.event.issue.pull_request && (github.event.comment.body == '/claim' || github.event.comment.body == '/unclaim') }}
    concurrency:
      # This is only a mutex. Each surviving command run replays every
      # uncheckpointed command, so replacement of a pending run loses nothing.
      group: claim-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read current issue state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" > "${RUNNER_TEMP}/issue.json"
          gh api --paginate --slurp "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "${RUNNER_TEMP}/comments.json"

      - name: Plan claim action
        id: plan
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          python3 scripts/claim_issue.py \
            --issue-json "${RUNNER_TEMP}/issue.json" \
            --comments-json "${RUNNER_TEMP}/comments.json" \
            --event-comment-id "${COMMENT_ID}" \
            --command "${COMMENT_BODY}" \
            --actor "${COMMENT_ACTOR}" \
            --association "${AUTHOR_ASSOCIATION}" \
            --comment-file "${RUNNER_TEMP}/response.md"

      - name: Apply claim state
        if: ${{ steps.plan.outputs.add_label != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ steps.plan.outputs.add_label }}
        run: gh api --method POST "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/labels" -f "labels[]=${LABEL}"

      - name: Apply released state
        if: ${{ steps.plan.outputs.remove_label != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ steps.plan.outputs.remove_label }}
        run: gh api --method DELETE "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/labels/${LABEL}"

      - name: Checkpoint reconciled state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "${ISSUE_NUMBER}" --body-file "${RUNNER_TEMP}/response.md"
