name: Validate repository

on:
  # Pull requests only: repository validation is the pre-merge boundary, and a
  # push to main is reserved for release-publish.yml (#538).
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Route tests (FAST/FULL)
        id: route
        # The router is trusted from the base, never the head: a PR that
        # introduces or edits it is FULL (#533). A separate blobless clone keeps
        # the checkout under test unchanged; any failure leaves the tier FULL.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          route_repo="$RUNNER_TEMP/ci-route"
          router="$RUNNER_TEMP/ci_test_route.py"
          # Defensive: only pull_request triggers this workflow, but any other
          # event would still resolve to FULL.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            reason="non-pull_request event ($EVENT_NAME)"
          elif git init -q "$route_repo" \
            && git -C "$route_repo" remote add origin "$REPO_URL" \
            && git -C "$route_repo" fetch -q --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA" \
            && git -C "$route_repo" show "$BASE_SHA:scripts/validation/ci_test_route.py" > "$router"; then
            exec python "$router" route --event-name "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --repo "$route_repo"
          else
            reason="no router at the base commit, or the base/head could not be fetched"
          fi
          printf '### CI test route\n\n- Tier: **FULL**\n- Reason: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          echo "tier=full" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        # The distribution consumer check drives the pinned `skills` CLI (#511).
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Skill metadata
        run: |
          python scripts/validation/validate-skill-metadata.py skills/local-code-review --containment-root .
          python scripts/validation/validate-skill-metadata.py skills/github-pr-review --containment-root .

      - name: Build the canonical Skill trees
        run: ./scripts/packaging/package-skills.sh all

      - name: Validate the built Skill trees against the Agent Skills spec
        # The reference validator (recorded result in #507: it rejects a
        # top-level `version`, which the build moves to metadata.version).
        run: |
          python -m pip install "skills-ref==0.1.1"
          for tree in dist/skills/*/; do agentskills validate "$tree"; done

      - name: Run repository tests
        # FULL unless the router positively selected FAST.
        if: ${{ steps.route.outputs.tier != 'fast' }}
        env:
          DISTRIBUTION_INSTALL_CHECK: "1"
        run: python -m unittest discover -s tests -t .

      - name: Run repository tests except tests.integration (FAST tier)
        if: ${{ steps.route.outputs.tier == 'fast' }}
        env:
          DISTRIBUTION_INSTALL_CHECK: "1"
        # The base's router, extracted by the route step, selects the tests.
        run: python "$RUNNER_TEMP/ci_test_route.py" run-fast

  skill-tree-parity:
    name: Skill tree (${{ matrix.shell }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the Skill trees with the platform script
        run: |
          if ("${{ matrix.shell }}" -eq "pwsh") { ./scripts/packaging/package-skills.ps1 all } else { ./scripts/packaging/package-skills.sh all }
        shell: pwsh

      - name: Upload the content manifest
        uses: actions/upload-artifact@v4
        with:
          name: skills-manifest-${{ matrix.shell }}
          path: dist/skills-manifest.json

  skill-tree-hash-equality:
    name: Shell and PowerShell trees are identical
    needs: skill-tree-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: skills-manifest-*
          path: manifests

      - name: Compare tree hashes
        run: |
          python - <<'PY'
          import json
          bash = json.load(open("manifests/skills-manifest-bash/skills-manifest.json"))
          pwsh = json.load(open("manifests/skills-manifest-pwsh/skills-manifest.json"))
          assert bash == pwsh, "shell and PowerShell builds produced different Skill trees"
          for name, tree in bash["skills"].items():
              print(name, tree["tree_hash"])
          PY
