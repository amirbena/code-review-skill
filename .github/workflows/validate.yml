name: Validate repository

on:
  pull_request:
  # Every merged commit runs the full suite (the router resolves any
  # non-pull_request event to FULL), so a stale FAST allowlist turns main red.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  route:
    name: Route tests (FAST/FULL)
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.route.outputs.tier }}
    steps:
      - name: Check out trusted router at base
        # The router is trusted from the base, never the head: a PR that
        # introduces or edits it is FULL (#533).
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Fetch pull request head
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA" || echo "::warning::Could not fetch the pull request head; routing falls back to FULL."

      - name: Route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/validation/ci_test_route.py ]; then
            python3 scripts/validation/ci_test_route.py route --event-name "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            echo "tier=full" >> "$GITHUB_OUTPUT"
            printf '### CI test route\n\n- Tier: **FULL**\n- Reason: no router at the base commit\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: route
    # Always created, so the required `test` context always reports; a failed
    # or skipped route leaves the tier empty, which runs FULL.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        # The distribution consumer check drives the pinned `skills` CLI (#511).
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Skill metadata
        run: |
          python scripts/validation/validate-skill-metadata.py skills/local-code-review --containment-root .
          python scripts/validation/validate-skill-metadata.py skills/github-pr-review --containment-root .

      - name: Build the canonical Skill trees
        run: ./scripts/packaging/package-skills.sh all

      - name: Validate the built Skill trees against the Agent Skills spec
        # The reference validator (recorded result in #507: it rejects a
        # top-level `version`, which the build moves to metadata.version).
        run: |
          python -m pip install "skills-ref==0.1.1"
          for tree in dist/skills/*/; do agentskills validate "$tree"; done

      - name: Run repository tests
        # FULL unless the router positively selected FAST.
        if: ${{ needs.route.outputs.tier != 'fast' }}
        env:
          DISTRIBUTION_INSTALL_CHECK: "1"
        run: python -m unittest discover -s tests -t .

      - name: Run repository tests except tests.integration (FAST tier)
        if: ${{ needs.route.outputs.tier == 'fast' }}
        env:
          DISTRIBUTION_INSTALL_CHECK: "1"
        run: python scripts/validation/ci_test_route.py run-fast

  skill-tree-parity:
    name: Skill tree (${{ matrix.shell }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the Skill trees with the platform script
        run: |
          if ("${{ matrix.shell }}" -eq "pwsh") { ./scripts/packaging/package-skills.ps1 all } else { ./scripts/packaging/package-skills.sh all }
        shell: pwsh

      - name: Upload the content manifest
        uses: actions/upload-artifact@v4
        with:
          name: skills-manifest-${{ matrix.shell }}
          path: dist/skills-manifest.json

  skill-tree-hash-equality:
    name: Shell and PowerShell trees are identical
    needs: skill-tree-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: skills-manifest-*
          path: manifests

      - name: Compare tree hashes
        run: |
          python - <<'PY'
          import json
          bash = json.load(open("manifests/skills-manifest-bash/skills-manifest.json"))
          pwsh = json.load(open("manifests/skills-manifest-pwsh/skills-manifest.json"))
          assert bash == pwsh, "shell and PowerShell builds produced different Skill trees"
          for name, tree in bash["skills"].items():
              print(name, tree["tree_hash"])
          PY
