name: Release publish

# Main/release lifecycle only: the authoritative, write-capable path.
# Triggered only by a `push` to `main` and, for recovery, manual
# `workflow_dispatch` — never by `pull_request`, so this file's `plan` and
# `publish` jobs never exist as PR check runs (not even `Skipped` ones).
# The companion .github/workflows/release-worthiness.yml is the read-only
# PR-triggered preview (`release-gate` + conditional `package`); it never
# runs this file's jobs and this file never trusts or consumes that
# preview's output — every run here recomputes the repository state itself
# from scripts/release/release_lib/, the same classification/changelog engine the
# PR preview uses.
#
# The read-only `plan` job generates `## Unreleased` from the merged PRs'
# release intent and derives the next version from it — no human supplies
# one; this is also the authoritative release-worthiness assessment (a
# classified, release-worthy accumulated set with real CHANGELOG
# coverage), not merely a version calculator. Only when it reports
# `should_release=true` does the `publish` job run: it generates and rolls
# the changelog, builds and verifies both Skill archives, commits to main,
# and tags, all through the trusted release GitHub App. `distribute` then
# publishes and verifies the distribution repository, and only after that
# does `finalize` create the GitHub Release (#528): a version never becomes
# an official source release before its distribution is verified. A normal
# merge that ships nothing releasable never starts `publish` at all — no
# write token, no release Environment gate. If the latest version stopped
# before finalization, `plan` fails closed on push and hands the same
# version to recovery on workflow_dispatch; it never plans past it.
#
# Classification, SemVer, and release checks: scripts/release/release_worthiness.py.
# Repository configuration (branch ruleset + the trusted release GitHub
# App that is the sole bypass actor): docs/RELEASE.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the release App's jobs (`publish`, `recover-tag`,
# `finalize`) are granted write, and they perform main/tag/release mutations
# with a short-lived GitHub App token, never the Actions GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    # Read-only. On trusted main state (a non-[skip ci] push to main, or
    # workflow_dispatch for recovery) it generates `## Unreleased` in memory
    # from the merged PRs' release intent and derives the next version with
    # release_worthiness.py auto-release-plan. It holds no write permission
    # and never touches the release App credentials, so a merge that ships
    # nothing releasable costs only this job. `publish` runs only when
    # should_release is true. The [skip ci] guard is belt-and-braces
    # against the release commit (which GitHub already skips) ever
    # re-entering this workflow and recursing.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads merged PRs' descriptions to generate `## Unreleased`.
      pull-requests: read
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      impact: ${{ steps.plan.outputs.impact }}
      baseline: ${{ steps.plan.outputs.baseline }}
      reason: ${{ steps.plan.outputs.reason }}
      recover: ${{ steps.plan.outputs.recover }}
      recover_version: ${{ steps.plan.outputs.recover_version }}
      recover_sha: ${{ steps.plan.outputs.recover_sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Plan the release (generate Unreleased from merged PR release intent, derive version)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/release/release_worthiness.py auto-release-plan \
            --event-name "${{ github.event_name }}" \
            --distribution-remote "https://github.com/amirbena/code-review-skills" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Summarize the plan
        run: |
          if [ "${{ steps.plan.outputs.should_release }}" = "true" ]; then
            {
              echo "## Release planned"
              echo
              echo "- Version: \`v${{ steps.plan.outputs.version }}\` (${{ steps.plan.outputs.impact }})"
              echo "- Since: \`${{ steps.plan.outputs.baseline }}\`"
              echo "- ${{ steps.plan.outputs.reason }}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## No release"
              echo
              echo "- ${{ steps.plan.outputs.reason }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    # Authoritative release flow. Runs only when `plan` reports a
    # classified, release-worthy accumulated set. This is
    # one of the release App's jobs behind the `release` Environment; it
    # mints a short-lived token from the trusted release GitHub App (the
    # sole bypass actor on the main branch ruleset) for the protected
    # push/tag mutations — the Actions GITHUB_TOKEN cannot bypass the
    # ruleset and is never used for them. It creates no GitHub Release:
    # the release commit and source tag are pre-finalization provenance
    # anchors the distribution names, and `finalize` publishes the Release
    # only after `distribute` verified. The release commit is marked
    # [skip ci] and no trigger here listens on tag pushes or releases, so
    # the flow cannot recurse. A retry after a completed release is a clean
    # no-op: `plan` reports nothing to release and this job does not run.
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Reads merged PRs' descriptions to generate `## Unreleased`.
      pull-requests: read
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require trusted release App credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are not configured. See docs/RELEASE.md — the release App is the only actor allowed to push to main."
            exit 1
          fi

      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # After checkout + Python so the extracted helper is on disk; still
      # before any repository mutation, and it fails closed with no
      # fallback identity (see scripts/release/release_lib/commands/workflow.py).
      - name: Resolve the authenticated release App bot identity
        id: bot-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/release/release_worthiness.py resolve-app-identity \
            --app-slug "${{ steps.app-token.outputs.app-slug }}" \
            --github-output "$GITHUB_OUTPUT"

      # The same deterministic generation `plan` previewed, now written to
      # the working tree so preflight, the roll, and the commit see it. The
      # only place contributor-declared entries enter CHANGELOG.md.
      - name: Generate CHANGELOG Unreleased from merged PR release intent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release/release_worthiness.py generate-changelog --base-ref "${{ needs.plan.outputs.baseline }}"

      - name: Preflight — release-worthy since last tag, changelog notes, new valid version/tag
        run: |
          python scripts/release/release_worthiness.py release-preflight \
            --version "${{ needs.plan.outputs.version }}" \
            --base-ref "${{ needs.plan.outputs.baseline }}"

      - name: Roll CHANGELOG Unreleased into v${{ needs.plan.outputs.version }}
        run: python scripts/release/release_worthiness.py prepare-changelog --version "${{ needs.plan.outputs.version }}"

      # Writes the planned version into both Skills' SKILL.md frontmatter so
      # the archives built next, and the commit after them, carry it.
      - name: Stamp the Skill frontmatter version v${{ needs.plan.outputs.version }}
        run: python scripts/release/release_worthiness.py stamp-skill-version --version "${{ needs.plan.outputs.version }}"

      - name: Build and verify Skill archives
        run: ./scripts/release/verify-skill-archives.sh --build --expect-version "${{ needs.plan.outputs.version }}"

      - name: Commit release preparation to main
        id: commit
        run: |
          git config user.name "${{ steps.bot-identity.outputs.login }}"
          git config user.email "${{ steps.bot-identity.outputs.email }}"
          git add CHANGELOG.md skills/*/SKILL.md
          git commit -m "chore(release): v${{ needs.plan.outputs.version }} [skip ci]"
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Release commit: ${sha}"

      - name: Push to main
        run: git push origin "HEAD:main"

      - name: Verify main advanced to the release commit
        run: |
          git fetch origin main
          have="$(git rev-parse FETCH_HEAD)"
          test "${have}" = "${{ steps.commit.outputs.sha }}" \
            || { echo "::error::origin/main is ${have}, expected ${{ steps.commit.outputs.sha }}"; exit 1; }

      - name: Create annotated tag at the release commit
        run: |
          git tag -a "v${{ needs.plan.outputs.version }}" "${{ steps.commit.outputs.sha }}" -m "Release v${{ needs.plan.outputs.version }}"

      - name: Push the tag
        run: git push origin "refs/tags/v${{ needs.plan.outputs.version }}"

      # No GitHub Release yet: that is `finalize`'s, after distribution-verify.
      - name: Verify the live tag and main advanced to the release commit
        run: |
          python scripts/release/release_worthiness.py release-verify \
            --version "${{ needs.plan.outputs.version }}" \
            --expected-sha "${{ steps.commit.outputs.sha }}"

      # The one build (skill trees, their manifest, and the zips built from
      # them) is handed to `distribute` and `finalize` unchanged; nothing is rebuilt.
      - name: Hand the single build to the distribution job
        uses: actions/upload-artifact@v4
        with:
          name: distribution-build
          path: |
            dist/skills
            dist/skills-manifest.json
            dist/*.zip
          if-no-files-found: error

      - name: Release summary
        run: |
          {
            echo "## Source tagged v${{ needs.plan.outputs.version }} (not yet released)"
            echo
            echo "- SemVer impact: ${{ needs.plan.outputs.impact }} (derived from merged PRs' release intent)"
            echo "- main commit: \`${{ steps.commit.outputs.sha }}\`"
            echo "- annotated tag \`v${{ needs.plan.outputs.version }}\` points at that commit, verified"
            echo "- the GitHub Release is created by \`finalize\` after the distribution is verified"
          } >> "$GITHUB_STEP_SUMMARY"

  recover-tag:
    # Recovery only (workflow_dispatch): the release commit reached main but
    # its source tag push failed. The tags ruleset lets only the release App
    # create tags, so a maintainer cannot finish this by hand; this job tags
    # exactly the commit `plan` found (subject `chore(release): vX.Y.Z
    # [skip ci]`, in main's history) with the release App, then
    # `distribute` and `finalize` complete the same version. It never moves
    # an existing tag.
    needs: plan
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      && needs.plan.outputs.recover == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Require trusted release App credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are not configured. See docs/RELEASE.md."
            exit 1
          fi

      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve the authenticated release App bot identity
        id: bot-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/release/release_worthiness.py resolve-app-identity \
            --app-slug "${{ steps.app-token.outputs.app-slug }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Tag the untagged release commit (never moves a tag)
        env:
          VERSION: ${{ needs.plan.outputs.recover_version }}
          SHA: ${{ needs.plan.outputs.recover_sha }}
        run: |
          git config user.name "${{ steps.bot-identity.outputs.login }}"
          git config user.email "${{ steps.bot-identity.outputs.email }}"
          python scripts/release/release_worthiness.py recover-release-tag \
            --version "${VERSION}" \
            --expected-sha "${SHA}"

  distribute:
    # Carries a tagged source release to the generated distribution
    # repository (#509). Runs after `publish` (source tag verified, no
    # GitHub Release yet), or on workflow_dispatch recovery when nothing new
    # is due — recovery republishes the latest source tag (after
    # `recover-tag` when that tag had to be created), a no-op when the
    # distribution already holds it. The version is never an input: it is
    # the source tag (created only by the release App, derived by `plan`).
    # It never force-pushes, and it fails the run (never skips) when
    # publication or verification fails; `finalize` runs only on its
    # success. It has its own Environment because the publishing App is a
    # different identity from the source release App (docs/RELEASE.md).
    needs: [plan, publish, recover-tag]
    if: >-
      ${{ always() && (needs.publish.result == 'success'
      || (github.event_name == 'workflow_dispatch'
          && needs.plan.result == 'success'
          && needs.plan.outputs.should_release != 'true'
          && (needs.plan.outputs.recover != 'tag' || needs.recover-tag.result == 'success'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release-skills-distribution
    concurrency:
      group: release-distribution
      cancel-in-progress: false
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require distribution publisher App credentials
        env:
          APP_ID: ${{ secrets.DISTRIBUTION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::DISTRIBUTION_APP_ID / DISTRIBUTION_APP_PRIVATE_KEY are not configured on the release-skills-distribution Environment. See docs/RELEASE.md."
            exit 1
          fi

      - name: Mint distribution App token (scoped to the distribution repository)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: amirbena
          repositories: code-review-skills

      - name: Check out the source release commit
        if: needs.publish.result == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out main to find the latest source release (recovery)
        if: needs.publish.result != 'success'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve the source version and commit
        id: source
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PLAN_VERSION: ${{ needs.plan.outputs.version }}
          PUBLISH_SHA: ${{ needs.publish.outputs.sha }}
          RECOVER_VERSION: ${{ needs.plan.outputs.recover_version }}
        run: |
          if [ "${PUBLISH_RESULT}" = "success" ]; then
            version="${PLAN_VERSION}"
            sha="${PUBLISH_SHA}"
          else
            tag="$(git tag --list --sort=-v:refname 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)"
            [ -n "${tag}" ] || { echo "::error::no source release tag exists; nothing to distribute"; exit 1; }
            version="${tag#v}"
            sha="$(git rev-parse "${tag}^{commit}")"
            git checkout --detach "${sha}"
            # Recovery finishes exactly the version `plan` found unfinalized.
            if [ -n "${RECOVER_VERSION}" ] && [ "${RECOVER_VERSION}" != "${version}" ]; then
              echo "::error::latest source tag ${tag} is not the unfinalized v${RECOVER_VERSION} plan reported"
              exit 1
            fi
          fi
          # The tag glob allows arbitrary characters; only a strict X.Y.Z
          # ever reaches a later step.
          printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::refusing malformed release version '${version}'"; exit 1; }
          printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::refusing malformed source commit '${sha}'"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Provenance: the tag the distribution will name must be this commit.
      - name: Verify the source tag resolves to the release commit
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          python scripts/release/release_worthiness.py release-verify \
            --version "${VERSION}" \
            --expected-sha "${SHA}" \
            --main-ancestor

      - name: Fetch the single build from the publish job
        if: needs.publish.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: distribution-build
          path: dist

      - name: Rebuild the tree from the source tag (recovery only)
        if: needs.publish.result != 'success'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: ./scripts/release/verify-skill-archives.sh --build --expect-version "${VERSION}"

      # The one recovery rebuild is what `finalize` releases, once
      # distribution-verify has proved it equals the distribution tag.
      - name: Hand the recovery rebuild to the finalize job
        if: needs.publish.result != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-rebuild
          path: dist/*.zip
          if-no-files-found: error

      - name: Resolve the publishing App bot identity
        id: bot-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/release/release_worthiness.py resolve-app-identity \
            --app-slug "${{ steps.app-token.outputs.app-slug }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish the distribution tree (fast-forward, idempotent, never forced)
        env:
          DISTRIBUTION_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GIT_NAME: ${{ steps.bot-identity.outputs.login }}
          GIT_EMAIL: ${{ steps.bot-identity.outputs.email }}
        run: |
          python scripts/release/release_worthiness.py distribution-publish \
            --version "${VERSION}" \
            --source-commit "${SHA}" \
            --source-repository "${SOURCE_REPOSITORY}" \
            --remote "https://github.com/amirbena/code-review-skills" \
            --git-name "${GIT_NAME}" \
            --git-email "${GIT_EMAIL}"

      - name: Verify the distribution tag equals the build
        env:
          DISTRIBUTION_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/release/release_worthiness.py distribution-verify \
            --version "${VERSION}" \
            --source-commit "${SHA}" \
            --source-repository "${SOURCE_REPOSITORY}" \
            --remote "https://github.com/amirbena/code-review-skills"

      - name: Distribution summary
        run: |
          {
            echo "## Distributed v${{ steps.source.outputs.version }}"
            echo
            echo "- source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- amirbena/code-review-skills tag \`v${{ steps.source.outputs.version }}\` verified against the build"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    # Makes the version an official source release (#528): creates the
    # GitHub Release from the same build's archives only after `distribute`
    # published and verified the distribution tag. Release App identity
    # (`release` Environment); it never touches the publisher App's
    # credentials. `release-finalize` is idempotent: it creates the Release,
    # completes a partial one (missing assets, a leftover draft), or no-ops
    # on an existing matching one, and fails closed without mutation when an
    # existing Release's tag, target, or asset digests differ from the
    # build. Its main check is ancestry, because main may have advanced
    # while distribution ran.
    needs: [plan, publish, distribute]
    if: ${{ always() && needs.distribute.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Require trusted release App credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are not configured. See docs/RELEASE.md."
            exit 1
          fi

      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out the source release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.distribute.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch the single build from the publish job
        if: needs.publish.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: distribution-build
          path: dist

      - name: Fetch the verified recovery rebuild from the distribute job
        if: needs.publish.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: distribution-rebuild
          path: dist

      - name: Create or complete the GitHub Release (idempotent, fails closed on mismatch)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.distribute.outputs.version }}
          SHA: ${{ needs.distribute.outputs.sha }}
        run: |
          python scripts/release/release_worthiness.py changelog-section --version "${VERSION}" > release-notes.md
          python scripts/release/release_worthiness.py release-finalize \
            --version "${VERSION}" \
            --expected-sha "${SHA}" \
            --notes-file release-notes.md \
            --asset dist/local-code-review-skill.zip \
            --asset dist/github-pr-review-skill.zip

      - name: Verify the GitHub Release, tag, and main ancestry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.distribute.outputs.version }}
          SHA: ${{ needs.distribute.outputs.sha }}
        run: |
          python scripts/release/release_worthiness.py release-verify \
            --version "${VERSION}" \
            --expected-sha "${SHA}" \
            --main-ancestor \
            --asset dist/local-code-review-skill.zip \
            --asset dist/github-pr-review-skill.zip

      - name: Release summary
        env:
          VERSION: ${{ needs.distribute.outputs.version }}
          SHA: ${{ needs.distribute.outputs.sha }}
        run: |
          {
            echo "## Released v${VERSION}"
            echo
            echo "- order: publish (source tag) → distribute (verified) → finalize"
            echo "- source commit: \`${SHA}\`"
            echo "- GitHub Release published with both Skill archives, digests verified against the distributed build"
          } >> "$GITHUB_STEP_SUMMARY"
