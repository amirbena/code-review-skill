name: Release worthiness

# Deterministically decides whether a change ships a Skill or its packaged
# distribution, and — when it does — enforces CHANGELOG coverage, builds and
# verifies the Skill archives, and prepares the next release. Classification
# logic lives in scripts/release_worthiness.py; the convention is documented
# in docs/RELEASE.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to roll '## Unreleased' into, e.g. 1.0.3 (release preparation only; no tag or GitHub Release is created)"
        required: true
        type: string

# Read-only by default. Only the release-prep job below widens this.
permissions:
  contents: read

concurrency:
  group: release-worthiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  assess:
    # PR and push checks only. This job can run untrusted contributor content,
    # so it stays strictly read-only and is never given write credentials.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            echo "ref=${prev}" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify change set and enforce CHANGELOG coverage
        id: classify
        run: |
          args="assess --require-changelog --github-output $GITHUB_OUTPUT"
          if [ -n "${{ steps.base.outputs.ref }}" ]; then
            args="$args --base-ref ${{ steps.base.outputs.ref }}"
          fi
          python scripts/release_worthiness.py $args

      - name: Build Skill package archives
        if: steps.classify.outputs.release_worthy == 'true'
        run: ./scripts/package-skills.sh all

      - name: Verify package integrity
        if: steps.classify.outputs.release_worthy == 'true'
        run: |
          for archive in dist/*.zip; do
            echo "== ${archive} =="
            unzip -t "${archive}"
          done
          python -m unittest tests.integration.test_packaging_runtime_boundary

      - name: Upload Skill archives
        if: steps.classify.outputs.release_worthy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skill-archives
          path: dist/*.zip
          if-no-files-found: error

      - name: Release-preparation summary
        if: steps.classify.outputs.release_worthy == 'true'
        run: |
          {
            echo "## Release recommended"
            echo
            echo "This change affects a Skill or its packaged distribution. A release is recommended."
            echo
            echo "- Trigger: ${{ steps.classify.outputs.reason }}"
            echo "- CHANGELOG \`Unreleased\` coverage: ${{ steps.classify.outputs.changelog_covered }}"
            echo "- Skill archives were built and integrity-checked; download them from this run's Artifacts."
            echo
            echo "Next: run this workflow via **Run workflow** with the target version to roll \`Unreleased\` into a versioned section on a \`release-prep/vX.Y.Z\` branch, then follow \`docs/RELEASE.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  release-prep:
    # Manual, maintainer-triggered only. This is the single job that needs to
    # commit generated changes, so it is the only one granted contents: write.
    # It pushes a release-prep branch (never main) with a [skip ci] commit, so
    # it cannot loop this workflow. It does not tag or publish a GitHub Release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Confirm the current state is release-worthy
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          args="assess"
          if [ -n "${prev}" ]; then args="$args --base-ref ${prev}"; fi
          python scripts/release_worthiness.py $args

      - name: Roll CHANGELOG Unreleased into the target version
        run: |
          python scripts/release_worthiness.py prepare-changelog --version "${{ inputs.version }}"

      - name: Build and verify Skill archives
        run: |
          ./scripts/package-skills.sh all
          for archive in dist/*.zip; do
            echo "== ${archive} =="
            unzip -t "${archive}"
          done

      - name: Push release-prep branch
        run: |
          branch="release-prep/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add CHANGELOG.md
          git commit -m "chore(release): prepare v${{ inputs.version }} changelog [skip ci]"
          git push --set-upstream origin "${branch}"
          echo "Pushed ${branch}. Open a PR from it; do not tag or publish a release from this workflow." >> "$GITHUB_STEP_SUMMARY"
