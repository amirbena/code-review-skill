name: Release worthiness

# PR lifecycle only: a read-only, pull-request-triggered preview of release
# worthiness. The authoritative main lifecycle (assessment, `plan`,
# `publish`) lives entirely in the separate
# .github/workflows/release-publish.yml, triggered only by `push` to `main`
# and `workflow_dispatch` — never by `pull_request` — so GitHub never
# creates `plan` or `publish` check runs (not even `Skipped` ones) on a PR.
# Both workflows drive the same scripts/release_lib/ classification and
# changelog engine; this file never re-implements or second-guesses it.
#
# `release-gate` is the required, always-created PR check: read-only, it
# classifies the change set and, when release-worthy, requires the PR to
# declare its release intent (CHANGELOG category + one-line entry) in its
# description — contributors never edit CHANGELOG.md. When the change is
# not release-relevant it still resolves, with an explicit not-applicable
# result, so a required-status-check ruleset entry never leaves an
# unrelated PR blocked. It never mutates the repository and never builds
# or uploads anything, so its identity and pass/fail never depend on
# release-worthy-only packaging work.
#
# `package` is a separate, non-required job that only runs when
# `release-gate` reports the change release-worthy: it builds and verifies
# both Skill archives and uploads them for inspection. A packaging failure
# there never fails the required gate.
#
# Classification, SemVer, and release checks: scripts/release_worthiness.py.
# Repository configuration (branch ruleset + the trusted release GitHub
# App that is the sole bypass actor): docs/RELEASE.md.

on:
  pull_request:
    # `edited`: fixing the release intent in the description re-runs the check.
    types: [opened, synchronize, reopened, edited]

# Read-only: this workflow never mutates the repository. The authoritative,
# write-capable `publish` job lives in release-publish.yml instead.
permissions:
  contents: read

concurrency:
  group: release-worthiness-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release-gate:
    # The required PR-level release gate. This workflow triggers only on
    # `pull_request`, so this job always evaluates a real PR — no
    # `workflow_dispatch` or `push` branch to exclude. This job can run
    # untrusted contributor content, so it stays strictly read-only, is
    # never given write credentials, and never builds or uploads packaging
    # artifacts — that conditional, release-worthy-only work lives entirely
    # in the separate `package` job below, so a packaging failure never
    # fails this required check.
    #
    # This job's name is the stable check identity — the same "Release
    # worthiness / release-gate" context is created and resolved for every
    # in-scope PR, release-relevant or not (see docs/RELEASE.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_worthy: ${{ steps.classify.outputs.release_worthy }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # The diff base for a PR is the fork point from the *current* base
      # branch, so release-worthy history pulled in by a sync/merge from
      # main is never charged to the PR. `fetch-depth: 0` already populated
      # origin/<base.ref>; refresh it, and fall back to it (or base.sha) if
      # the refresh cannot run.
      - name: Fetch the PR base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}" \
            || echo "base branch refresh skipped; using origin/${{ github.event.pull_request.base.ref }} from checkout"

      - name: Determine base ref
        id: base
        run: |
          python scripts/release_worthiness.py resolve-base-ref \
            --event-name "${{ github.event_name }}" \
            --pr-base-ref "${{ github.event.pull_request.base.ref }}" \
            --pr-base-sha "${{ github.event.pull_request.base.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      # The PR description is contributor text: it reaches the script only
      # through env (PR_BODY), never interpolated into this shell step. This
      # workflow only ever sees `pull_request` events, so release intent is
      # always enforced here; the script writes the release-recommended
      # summary, with the entry that will be generated. The `EVENT_NAME`
      # branch below is defense-in-depth against a future trigger addition,
      # matching the generic `resolve-base-ref`/`assess` subcommands shared
      # with release-publish.yml's authoritative assessment.
      - name: Classify change set and enforce release intent
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          intent=()
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            intent=(--require-release-intent --pr-body-env PR_BODY --pr-number "${PR_NUMBER}")
          fi
          python scripts/release_worthiness.py assess \
            --base-ref "${{ steps.base.outputs.ref }}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            "${intent[@]}"

  package:
    # Conditional, release-worthy-only packaging work. Deliberately not a
    # required status check: it never gates an unrelated PR, and a failure
    # here (a flaky build, a packaging regression) never fails the required
    # `release-gate` check above. Applicability is `release-gate`'s own
    # classification output — not a second, YAML-level relevance decision.
    needs: release-gate
    if: needs.release-gate.outputs.release_worthy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and verify Skill package archives
        run: ./scripts/release/verify-skill-archives.sh --build

      - name: Check the packaging runtime boundary
        run: python -m unittest discover -s tests/integration/packaging -t .

      - name: Upload Skill archives
        uses: actions/upload-artifact@v4
        with:
          name: skill-archives
          path: dist/*.zip
          if-no-files-found: error
