name: Bug Report
description: Something in a Skill or the repository tooling is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what went wrong. Keep it short — a maintainer can follow up
        for details. Do not include secrets or private code.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The problem, plus any error message or review output you saw.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Skill
      options:
        - local-code-review
        - github-pr-review
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — links, screenshots, environment.
    validations:
      required: false
