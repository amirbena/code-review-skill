name: Feature Request
description: Propose new or changed behavior for a Skill or the repository tooling.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you want to be different. Focus on the outcome — a
        maintainer or agent can work out the implementation later.

  - type: textarea
    id: improvement
    attributes:
      label: What would you like to improve?
      description: The problem you hit and the outcome you want instead.
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Affected Skill/area
      description: e.g. local-code-review, github-pr-review, both, repository tooling.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — links, related issues, prior discussion.
    validations:
      required: false
