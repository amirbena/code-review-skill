    @@ -0,0 +1,15 @@
    +# Order search
    +
    +Status: Draft
    +
    +## Goal
    +
    +Support search over orders. Search results may lag writes by up to 30 seconds.
    +
    +## Approach
    +
    +A background indexer copies changed orders into the search index.
    +
    +## Trade-offs
    +
    +Search is eventually consistent. A newly created order can be missing from results for up to 30 seconds. We accept this to keep order writes independent of the index.

