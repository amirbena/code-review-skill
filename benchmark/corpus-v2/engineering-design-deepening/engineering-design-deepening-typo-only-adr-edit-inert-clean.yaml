format: benchmark-case/v2

id: engineering-design-deepening-typo-only-adr-edit-inert-clean
title: "A change fixes a spelling error in an accepted ADR and changes no decision"

input:
  patch: |
    diff --git a/docs/adr/0007-ledger-writes.md b/docs/adr/0007-ledger-writes.md
    index 1111111..2222222 100644
    --- a/docs/adr/0007-ledger-writes.md
    +++ b/docs/adr/0007-ledger-writes.md
    @@ -5,5 +5,5 @@ Status: Accepted
     ## Decision
     
     Every write to ledger_entries goes through ledger_service.post_entry.
    -Callers must not insert into the table direcly, because the service
    +Callers must not insert into the table directly, because the service
     enforces the double-entry balance check and the audit trail.
  base:
    docs/adr/0007-ledger-writes.md: |
      # ADR 0007: Ledger writes

      Status: Accepted

      ## Decision

      Every write to ledger_entries goes through ledger_service.post_entry.
      Callers must not insert into the table direcly, because the service
      enforces the double-entry balance check and the audit trail.

expected:
