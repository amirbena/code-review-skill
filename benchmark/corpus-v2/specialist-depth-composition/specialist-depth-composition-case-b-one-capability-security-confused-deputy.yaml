# Specialist-depth-composition corpus case (Issue #85, parent #47).
# Format: ../../fixture-format.md. See ./README.md for the cluster.
#
# specialist-depth.md's Case B: exactly one materially implicated
# dimension warrants domain-specific deepening. Reuses (rather than
# re-derives) the Security deepening domain corpus's (#271, parent #83)
# confused-deputy-worker-credential scenario verbatim as the integration
# input, per #85's Scope: domain fixture issues own single-domain
# correctness; #85 proves that exactly the one warranted capability
# engages and its output stays inside the shared finding model.

format: benchmark-case/v2

id: specialist-depth-composition-case-b-one-capability-security-confused-deputy
title: "Background worker uses its own service credential to transfer funds requested by an unvalidated job payload"

input:
  patch: |
    diff --git a/worker/job_processor.py b/worker/job_processor.py
    index 1111111..2222222 100644
    --- a/worker/job_processor.py
    +++ b/worker/job_processor.py
    @@ -7,2 +7,12 @@ def process_job(job):
         if job["type"] == "send_notification":
             service_client.notify(job["payload"]["message"], credentials=SERVICE_CREDENTIALS)
    +        return
    +
    +    if job["type"] == "transfer_funds":
    +        payload = job["payload"]
    +        service_client.transfer(
    +            payload["source_account"],
    +            payload["destination_account"],
    +            payload["amount"],
    +            credentials=SERVICE_CREDENTIALS,
    +        )
  base:
    worker/job_processor.py: |
      import service_client

      SERVICE_CREDENTIALS = service_client.load_credentials()


      def process_job(job):
          if job["type"] == "send_notification":
              service_client.notify(job["payload"]["message"], credentials=SERVICE_CREDENTIALS)

expected:
  decision: changes-required
  findings_completeness: exhaustive
  findings:
    - key: transfer-funds-confused-deputy
      match: required
      severity: P0
      location:
        location_intent: line
        path: worker/job_processor.py
        symbol: process_job
        anchor: 'payload["source_account"]'
      claim: >-
        process_job dispatches a "transfer_funds" job by calling
        service_client.transfer with the worker's own SERVICE_CREDENTIALS
        and the source_account/destination_account/amount taken directly
        from the job payload, without checking whether the user who
        enqueued the job is actually authorized to move funds out of
        source_account -- the worker's elevated privilege is exercised on
        the untrusted caller's behalf with no re-check at the point the
        privileged action is taken, a confused-deputy path an attacker who
        can enqueue a job can use to transfer funds out of an arbitrary
        account.
      defect_kind: confused-deputy-unchecked-delegation
    - key: missing-security-regression-test
      match: optional
      severity: [P1, P2]
      location:
        location_intent: file
        path: worker/job_processor.py
      claim: >-
        The new transfer_funds job type has no test covering authorization
        of the requesting user against the source account.
      defect_kind: missing-security-test

metadata:
  source: crafted
  tags: [security]
  rationale: >-
    Pins specialist-depth.md's Case B ("one deepening capability"): base
    reasoning identifies the job-payload -> privileged-worker trust
    boundary crossing (a materially implicated dimension per #211), and
    its own evidence (no re-check of the requesting user's authorization
    before the privileged transfer) shows the concern is not fully
    resolved by bounded base reasoning alone. Security deepening engages
    -- and only security deepening; nothing in this diff implicates
    database, performance, dependency, or distributed-systems concerns --
    and its finding remains an ordinary P0 in the shared finding model,
    reusing #271's own domain-correctness fixture rather than re-deriving
    a new confused-deputy scenario.
  taxonomy:
    capability: [specialist-depth-composition]
    policy_contract: [specialist-depth]
    risk_mode: [security]
    affected_surface: [unclassified]
