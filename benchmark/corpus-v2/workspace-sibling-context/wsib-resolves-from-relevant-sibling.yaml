# Workspace sibling context corpus case (Issue #664). Format:
# ../../../runtime_platform/benchmark/fixture-format.md `input.workspace_siblings`.
# See ./README.md for the cluster.
#
# payment-service adds refunded to PaymentStatus. Alone the diff is context-
# dependent. The ledger-consumer sibling is named by docs/consumers.md and
# holds a copy of the schema; its HEAD apply_status raises on any unknown
# status, so sibling evidence resolves the question before escalation. docs-
# site is unrelated.

format: benchmark-case/v2

id: wsib-resolves-from-relevant-sibling
title: "PaymentStatus gains refunded; the one relevant workspace sibling has a strict consumer"

input:
  patch: |
    diff --git a/schemas/payment_status.schema.json b/schemas/payment_status.schema.json
    --- a/schemas/payment_status.schema.json
    +++ b/schemas/payment_status.schema.json
    @@ -2,5 +2,5 @@
       "$schema": "http://json-schema.org/draft-07/schema#",
       "title": "PaymentStatus",
       "type": "string",
    -  "enum": ["pending", "completed", "failed"]
    +  "enum": ["pending", "completed", "failed", "refunded"]
     }
  base:
    schemas/payment_status.schema.json: |
      {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "PaymentStatus",
        "type": "string",
        "enum": ["pending", "completed", "failed"]
      }
    docs/consumers.md: |
      # Consumers

      - ledger-consumer: applies payment statuses to ledger entries.
  workspace_siblings:
    ledger-consumer:
      files:
        ledger/apply_status.py: |
          def apply_status(entry, status):
              if status == "pending":
                  entry.hold()
              elif status == "completed":
                  entry.settle()
              elif status == "failed":
                  entry.release()
              else:
                  raise ValueError(f"unknown payment status: {status}")
        contracts/payment_status.schema.json: |
          {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "PaymentStatus",
            "type": "string",
            "enum": ["pending", "completed", "failed"]
          }
    docs-site:
      files:
        README.md: |
          # Docs site

          Static documentation for the public website.
  context: >-
    The caller grants a workspace root once. Sibling repositories under it
    are read-only evidence for an unresolved question, never part of the
    Review Target.

expected:
  decision: changes-required
  findings_completeness: exhaustive
  findings:
    - key: payment-status-refunded-breaks-workspace-ledger-consumer
      match: required
      severity: P1
      location:
        location_intent: line
        path: schemas/payment_status.schema.json
        symbol: PaymentStatus
        anchor: '"enum": ["pending", "completed", "failed", "refunded"]'
      claim: >-
        PaymentStatus gains a refunded member, and the ledger-consumer
        sibling in the granted workspace handles only pending, completed,
        and failed and raises ValueError for any other status. Once
        refunded is produced that consumer fails on it, so the additive
        enum change is breaking for this consumer. The finding is located
        at the schema change, with the sibling file cited only as
        evidence.
      defect_kind: breaking-contract-enum-member-added-exhaustive-consumer
      alternatives:
        # Amendment after the first C3 smoke (#664): a real, correct finding of this
        # defect (same location, same exhaustive-consumer ValueError, sibling cited
        # as evidence) named the class `breaking-enum-extension`, which the slug
        # compatibility rule cannot relate to the long primary slug. Same defect,
        # restated; the matcher and every threshold are unchanged.
        - defect_kind: breaking-enum-extension

metadata:
  source: crafted
  tags: [correctness, regression]
  rationale: >-
    Issue #664 class 1: successful resolution from relevant sibling
    evidence. The capability-enabled arm should close the question with a
    located, evidence-backed finding; the capability-disabled arm cannot.
  taxonomy:
    capability: [workspace-sibling-context]
    policy_contract: [workspace-sibling-context]
    risk_mode: [correctness, regression]
    affected_surface: [benchmark-corpus-or-tooling]
