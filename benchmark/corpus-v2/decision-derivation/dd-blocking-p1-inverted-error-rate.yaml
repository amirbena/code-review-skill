# Decision-derivation corpus case (Issue #350). Format:
# docs/benchmark/fixture-format.md. See ./README.md for the cluster.
#
# Forward-direction proof, P1 side: an unambiguous functional bug. The
# change swaps the operands of a division, so error_rate returns
# total / errors instead of errors / total — wrong for every input and a
# ZeroDivisionError when there are no errors. Per severity.md a
# functional bug is blocking (P1, or P0 if a reviewer judges it a
# production-critical flow), so the rendered Result/Decision must be the
# blocking value, never clean/approved.

format: benchmark-case/v2

id: dd-blocking-p1-inverted-error-rate
title: "error_rate divides total by errors instead of errors by total"

input:
  patch: |
    diff --git a/admin/dashboard.py b/admin/dashboard.py
    index 3333333..4444444 100644
    --- a/admin/dashboard.py
    +++ b/admin/dashboard.py
    @@ -1,3 +1,3 @@
     def error_rate(errors, total):
         """Return the fraction of requests that failed, in [0, 1]."""
    -    return errors / total
    +    return total / errors
  base:
    admin/dashboard.py: |
      def error_rate(errors, total):
          """Return the fraction of requests that failed, in [0, 1]."""
          return errors / total

expected:
  decision: changes-required
  findings_completeness: exhaustive
  findings:
    - key: error-rate-operands-inverted
      match: required
      severity: [P0, P1]
      location:
        location_intent: line
        path: admin/dashboard.py
        symbol: error_rate
        anchor: "return total / errors"
      claim: >-
        error_rate now divides total by errors instead of errors by total,
        so it returns the wrong value for every input (contradicting its
        own docstring's [0, 1] contract) and raises ZeroDivisionError when
        there are no errors.
      defect_kind: inverted-operands

    # Optional (severity may be P1 or P2): the change alters a computed
    # value and adds no test. Present so a review that (correctly) asks for
    # a test is not scored as an unexpected finding under
    # `findings_completeness: exhaustive`.
    - key: missing-error-rate-test
      match: optional
      severity: [P1, P2]
      location:
        location_intent: file
        path: admin/dashboard.py
      claim: >-
        the change alters the error_rate computation and adds no test
        pinning its expected fraction.
      defect_kind: missing-test

metadata:
  source: crafted
  tags: [correctness]
  rationale: >-
    The forward-direction (#350) proof for the P1 side of the mechanical
    severity -> decision derivation: an unambiguous functional bug that
    must render a blocking Result and Decision, never `REVIEW CLEAN` /
    `Approve`. `severity: [P0, P1]` permits either blocking classification
    (severity variance, fixture-format.md §9) — both derive the same
    blocking decision, so the case pins the decision, not a debatable
    P0-vs-P1 call.
  taxonomy:
    capability: [decision-derivation]
    policy_contract: [severity]
    risk_mode: [correctness]
    affected_surface: [unclassified]
