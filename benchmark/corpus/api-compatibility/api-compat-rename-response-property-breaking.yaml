# API-compatibility corpus case (Issue #184, parent #175). Format:
# ../../fixture-format.md. See ./README.md for the cluster.
#
# JSON Schema. A response property is renamed. This is the "rename
# response property -> breaking" case required by Issue #184's scope: to a
# strict consumer a rename is indistinguishable from removing the old
# property and adding an unrelated new one, so it breaks both readers of
# the old name and, once required, senders that never knew the new one.

format: benchmark-case/v2

id: api-compat-rename-response-property-breaking
title: "Profile renames full_name to fullName, breaking both directions for existing clients"

input:
  patch: |
    diff --git a/schemas/profile.schema.json b/schemas/profile.schema.json
    index 1111111..2222222 100644
    --- a/schemas/profile.schema.json
    +++ b/schemas/profile.schema.json
    @@ -4,7 +4,7 @@
       "type": "object",
       "properties": {
         "id": { "type": "string" },
    -    "full_name": { "type": "string" }
    +    "fullName": { "type": "string" }
       },
    -  "required": ["id", "full_name"]
    +  "required": ["id", "fullName"]
     }
  base:
    schemas/profile.schema.json: |
      {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Profile",
        "type": "object",
        "properties": {
          "id": { "type": "string" },
          "full_name": { "type": "string" }
        },
        "required": ["id", "full_name"]
      }

expected:
  decision: changes-required
  findings_completeness: exhaustive
  findings:
    - key: profile-full-name-renamed-to-fullname
      match: required
      severity: P1
      location:
        location_intent: line
        path: schemas/profile.schema.json
        symbol: Profile
        anchor: '"full_name": { "type": "string" }'
      claim: >-
        Profile's full_name property is renamed to fullName. To a strict
        consumer this is indistinguishable from deleting full_name and
        adding an unrelated fullName field: every existing client reading
        profile.full_name gets a missing value, and required now demands
        the new key name from clients that only ever sent full_name — the
        rename breaks both response readers and request senders.
      defect_kind: breaking-contract-property-renamed

metadata:
  source: crafted
  tags: [correctness, regression]
  rationale: >-
    A rename is a distinct change shape from plain removal (Issue #175's
    scope lists it separately) precisely because it is easy to mistake for
    a harmless cosmetic edit; the case pins that it is breaking exactly
    like removal, not compatible.
  taxonomy:
    capability: [api-compatibility]
    policy_contract: [api-contract-compatibility]
    risk_mode: [correctness, regression]
    affected_surface: [unclassified]
