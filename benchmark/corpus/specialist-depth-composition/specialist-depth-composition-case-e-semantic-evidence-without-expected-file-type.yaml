# Specialist-depth-composition corpus case (Issue #85, parent #47).
# Format: ../../fixture-format.md. See ./README.md for the cluster.
#
# specialist-depth.md's Case E: semantic evidence of a persisted-state
# implication can trigger deepening even with no .sql file and no
# migration directory touched anywhere in the diff. No dedicated domain
