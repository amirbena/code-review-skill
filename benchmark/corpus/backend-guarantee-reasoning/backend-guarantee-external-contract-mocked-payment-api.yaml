# Backend guarantee-reasoning corpus case (Issue #874). See ./README.md. External-dependency contract: a second, different service shown only by a fake.

format: benchmark-case/v3

id: backend-guarantee-external-contract-mocked-payment-api
title: "refund_idempotent assumes the payment API deduplicates on Idempotency-Key, shown only by a fake client"

input:
  patch: |
    diff --git a/app/payments.py b/app/payments.py
    index 1111111..2222222 100644
    --- a/app/payments.py
    +++ b/app/payments.py
    @@ -1,3 +1,8 @@
     def refund(client, charge_id, amount):
         resp = client.post("/refunds", {"charge": charge_id, "amount": amount})
         return resp["status"] == "succeeded"
    +
    +
    +def refund_idempotent(client, charge_id, amount, key):
    +    resp = client.post("/refunds", {"charge": charge_id, "amount": amount}, headers={"Idempotency-Key": key})
    +    return resp["status"] == "succeeded"
  base:
    app/payments.py: |
      def refund(client, charge_id, amount):
          resp = client.post("/refunds", {"charge": charge_id, "amount": amount})
          return resp["status"] == "succeeded"
    tests/test_payments.py: |
      from app import payments


      class FakeClient:
          def post(self, path, body, headers=None):
              return {"status": "succeeded"}


      def test_refund_idempotent_succeeds():
          assert payments.refund_idempotent(FakeClient(), "ch_1", 5, "k1")

expected:
  decision: clean
  findings_completeness: exhaustive
  findings:
    - key: idempotency-key-semantics-only-fake-backed
      match: required
      severity: P2
      location:
        location_intent: line
        path: app/payments.py
        symbol: refund_idempotent
        anchor: 'headers={"Idempotency-Key": key}'
      claim: >-
        refund_idempotent assumes the payment API returns the original result for a repeated Idempotency-Key. FakeClient in tests/test_payments.py always returns succeeded and never models repeats, and no contract document or integration test in the repo states the API's behaviour. The guarantee is unverified, a test gap rather than a demonstrated defect, so P2.
      defect_kind: external-contract-established-only-by-mock

metadata:
  skill_set: [review-core, review-backend]
  skill_set_reason: "Needs backend guarantee reasoning over code and config."
  source: crafted
  tags: [concurrency]
  rationale: >-
    Second external-contract mechanism, a different service and a different guarantee (deduplication), so the check cannot be memorised as a datastore case.
  taxonomy:
    capability: [distributed-systems]
    policy_contract: [distributed-systems-deepening]
    risk_mode: [concurrency]
    affected_surface: [unclassified]
