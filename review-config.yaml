# Runtime-neutral configuration contract for the Code Review Agent Skill.
# Consumed conceptually by SKILL.md — do not hardcode these values
# inside procedural sections of the Skill definition.

review:
  # Maximum number of passive review/fix/re-review iterations to run
  # automatically against a local implementation before stopping and
  # returning any remaining blocking findings. See
  # runbooks/review-loop.md.
  max_loops: 3
